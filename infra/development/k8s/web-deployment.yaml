apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fastapi-starter
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: fastapi-starter/web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "development"
            - name: VITE_API_URL
              value: "http://localhost:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fastapi-starter
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 5173
      targetPort: 5173
  type: ClusterIP
